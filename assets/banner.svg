<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.2" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-5px); }
      }
      @keyframes waveDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 120; }
      }
      @keyframes ping {
        0% { r: 3; opacity: 1; }
        100% { r: 16; opacity: 0; }
      }
      .anim-orb-1 {
        transform-origin: 200px 140px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .anim-orb-2 {
        transform-origin: 1000px 280px;
        animation: pulseGlow 9s ease-in-out infinite 1s;
      }
      .anim-card-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .anim-card-2 {
        animation: floatSlow2 7s ease-in-out infinite 0.5s;
      }
      .anim-wave {
        stroke-dasharray: 8 6;
        animation: waveDash 12s linear infinite;
      }
      .pulse-ring {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Orbs in Background -->
  <circle class="anim-orb-1" cx="200" cy="140" r="180" fill="url(#orbGrad1)" filter="url(#softGlow)" />
  <circle class="anim-orb-2" cx="1000" cy="280" r="210" fill="url(#orbGrad2)" filter="url(#softGlow)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#cyberGrid)" />

  <!-- Background Animated Network Wave Lines (Behind text) -->
  <g opacity="0.45">
    <path class="anim-wave" d="M -50,330 C 250,220 450,420 750,300 C 950,220 1100,320 1250,250" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="anim-wave" d="M -50,90 C 220,180 500,60 800,150 C 1020,210 1150,110 1250,140" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dashoffset="60" />
  </g>

  <!-- Dynamic Corner Decorative Badges (Framing without obstructing) -->
  <g class="anim-card-1" transform="translate(60, 48)">
    <rect width="180" height="44" rx="22" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="24" cy="22" r="5" fill="#10b981" />
    <circle class="pulse-ring" cx="24" cy="22" r="5" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="40" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">AGENTIC WORKFLOWS</text>
  </g>

  <g class="anim-card-2" transform="translate(960, 48)">
    <rect width="180" height="44" rx="22" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="24" cy="22" r="5" fill="#38bdf8" />
    <circle class="pulse-ring" cx="24" cy="22" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="40" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">OMNICHANNEL AI</text>
  </g>

  <g class="anim-card-2" transform="translate(70, 328)">
    <rect width="184" height="44" rx="22" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="24" cy="22" r="5" fill="#ec4899" />
    <circle class="pulse-ring" cx="24" cy="22" r="5" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <text x="40" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">AUTONOMOUS VOICE</text>
  </g>

  <g class="anim-card-1" transform="translate(950, 328)">
    <rect width="190" height="44" rx="22" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="24" cy="22" r="5" fill="#38bdf8" />
    <circle class="pulse-ring" cx="24" cy="22" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="40" y="27" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">OPEN-SOURCE AGENTS</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Clear Foreground Layer) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <rect x="475" y="80" width="250" height="34" rx="17" fill="#1e293b" fill-opacity="0.95" stroke="#6366f1" stroke-width="1.4" />
    <text x="600" y="102" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Conversational AI Assistant</text>
    <text x="600" y="180" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Conversational AI Assistant</text>

    <!-- Subtitle -->
    <text x="600" y="226" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Enterprise SaaS Solutions, Autonomous Voice Bots &amp; Open-Source Helpdesk AI
    </text>

    <!-- Feature Pillars in Foreground -->
    <g transform="translate(310, 256)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="85" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Agentic Resolution</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="190" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="95" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">💬 Omnichannel Chat &amp; Voice</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(410, 0)">
        <rect width="170" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="85" y="21" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🔒 Self-Hosted Frameworks</text>
      </g>
    </g>
  </g>

  <!-- Modern Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" />
</svg>
